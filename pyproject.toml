[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looprl"
version = "0.1.0"
description = "Reproducible validation of sequence-depth and exit-marginal RL for Ouro"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
ouro = ["transformers==4.57.1", "huggingface-hub>=0.34,<1", "accelerate>=1.0", "math-verify==0.8.0", "datasets>=2.18", "jinja2>=3.1"]
test = ["pytest>=8"]
slime = ["ray[default]==2.48.0", "straw-queue==0.1.8", "wandb==0.19.11", "tensorboard==2.21.0", "blake3==1.0.10", "protobuf>=5,<7"]

[project.scripts]
looprl = "looprl.cli:main"

[tool.setuptools.packages.find]
include = ["looprl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
